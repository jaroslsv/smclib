[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "smclib"
version = "0.1.1"
description = "A library for simple numpy based Monte-Carlo simulations"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Yaroslav Kovalev"}
]
keywords = ["Monte-Carlo", "Simulation", "numpy", "Python"]
dependencies = [
    "numpy",
    "matplotlib",
]